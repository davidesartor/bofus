[project]
name = "bofus"
version = "0.1.0"
description = "Bayesian Optimization of Functions - NeurIPS 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "equinox>=0.13.6",
    "gymnasium[box2d,mujoco]>=1.2.3",
    "ipykernel>=7.2.0",
    "jax>=0.9.2",
    "jaxtyping>=0.3.9",
    "jaxvlse>=0.1.3",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "moviepy>=2.2.1",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=25.0.0",
    "statsmodels>=0.14.6",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bofus", "src/targets"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
