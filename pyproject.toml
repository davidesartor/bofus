[project]
name = "bofus"
version = "0.1.0"
description = "Bayesian Optimization of Functions - NeurIPS 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "equinox>=0.13.6",
    "gymnasium>=1.2.3",
    "ipykernel>=7.2.0",
    "jax>=0.9.2",
    "jaxtyping>=0.3.9",
    "jaxvlse>=0.1.3",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "optax>=0.2.8",
    "pandas>=3.0.2",
    "pyarrow>=25.0.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
]

[project.scripts]
bofus-run = "run:main"
bofus-summary = "bofus.summary:main"
bofus-plots = "bofus.plots:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bofus", "src/targets", "src/run.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
